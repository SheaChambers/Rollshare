<div class="community-container">
    <header class="page-header">
        <h1 class="page-title">Community</h1>
    </header>

    <div class="community-tabs">
        <button (click)="switchTab('feed')" [class.active]="activeTab === 'feed'">Activity Feed</button>
        <button (click)="switchTab('friends')" [class.active]="activeTab === 'friends'">Friends</button>
        <button (click)="switchTab('clubs')" [class.active]="activeTab === 'clubs'">Clubs</button>
    </div>

    <div *ngIf="activeTab === 'feed'" class="feed-list">
        <div class="technique-grid">
            <app-technique-card 
                *ngFor="let post of communityPosts"
                [technique]="post"
                [buttonText]="'View Technique'">
            </app-technique-card>
        </div>
    </div>

    <div *ngIf="activeTab === 'clubs'" class="clubs-list">

        <button class="btn-add-gym" *ngIf="auth.isLoggedIn()"
                (click)="goToAddGym()">
            + Register a Gym
        </button>

        <div class="top-controls">

            <!-- Search -->
            <input 
            type="text"
            class="search-input"
            placeholder="Search for a Gym"
            [(ngModel)]="searchTerm"
            (input)="applyFilters()">

            <!-- Filters button -->
            <button class="btn-filters" (click)="toggleFilters()">Filters</button>

            <div class="filters-panel" *ngIf="filtersOpen">

                <h3 class="filter-title">Filters</h3>

                <!-- MULTI-SELECT CITIES -->
                <label>Cities</label>
                <div class="multi-select-box">
                    <label *ngFor="let city of cityList" class="multi-option">
                        <input type="checkbox"
                            [value]="city"
                            [checked]="selectedCities.includes(city)"
                            (change)="toggleCitySelection($event)">
                        {{ city }}
                    </label>
                </div>

                <!-- TAG FILTERS -->
                <label>Gym Tags</label>
                <div class="multi-select-box">
                    <label class="multi-option">
                        <input type="checkbox" value="verified" [checked]="selectedTags.includes('verified')" (change)="toggleTag($event)">
                        Verified
                    </label>
                    <label class="multi-option">
                        <input type="checkbox" value="popular" [checked]="selectedTags.includes('popular')" (change)="toggleTag($event)">
                        Popular (5+ reviews)
                    </label>
                    <label class="multi-option">
                        <input type="checkbox" value="multiCoach" [checked]="selectedTags.includes('multiCoach')" (change)="toggleTag($event)">
                        Multiple Coaches
                    </label>
                </div>

                <!-- SORT -->
                <label>Sort By</label>
                    <select class="filter-select" [(ngModel)]="sortBy">
                    <option value="name">A-Z</option>
                    <option value="rating">Highest Rating</option>
                    <option value="popularity">Most Reviewed</option>
                </select>

                <div class="filter-buttons">
                    <button class="btn-reset" (click)="resetFilters()">Reset</button>
                    <button class="btn-apply" (click)="applyFilters()">Apply</button>
                </div>

            </div>
        </div>

        <div class="gyms-grid">
            <app-gym-card
                *ngFor="let club of communityClubs"
                [gym]="club">
            </app-gym-card>
        </div>

        <div class="empty-state" *ngIf="communityClubs.length === 0 && !isLoading">
            <p>No gyms found in your area yet.</p>
        </div>
    </div>
</div>
