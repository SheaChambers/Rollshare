<div class="reviews-section">

    <div class="no-reviews" *ngIf="reviews.length === 0">
        No reviews yet - be the first!
    </div>

    <div class="reviews-grid" *ngIf="reviews.length > 0">
        <div class="review-card" *ngFor="let r of reviews">

            <div class="review-header">
                <div class="review-user">
                    <div class="avatar-circle">
                        <img *ngIf="r.avatar_url" [src]="r.avatar_url" class="avatar-img">
                        <span *ngIf="!r.avatar_url" class="avatar-placeholder">
                            {{ r.user?.charAt(0) }}
                        </span>
                    </div>
                    <strong>{{ r.user }}</strong>
                </div>
            </div>

            <p class="review-comment">{{ r.comment }}</p>

            <div class="review-actions" *ngIf="auth.getUsername() === r.user || auth.isAdmin()">

                <button class="btn-review-edit" (click)="startEdit(r)">
                    Edit
                </button>

                <button class="btn-review-delete" (click)="startDelete(r)">
                    Delete
                </button>
            </div>
        </div>
    </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" *ngIf="showEditModal">
    <div class="modal-box edit-modal">

        <h2>Edit Comment</h2>

        <label>Comment</label>
        <textarea [(ngModel)]="editingReview.comment"></textarea>

        <div class="modal-buttons">
            <button class="btn-cancel" (click)="showEditModal = false">Cancel</button>
            <button class="btn-save" (click)="saveEdit()">Save</button>
        </div>

    </div>
</div>

<!-- DELETE CONFIRMATION MODAL -->
<div class="modal-backdrop" *ngIf="deleteTarget">
    <div class="modal-box delete-box">

        <h2>Delete Comment?</h2>
        <p>This action cannot be undone.</p>

        <div class="modal-buttons">
            <button class="btn-cancel" (click)="cancelDelete()">Cancel</button>
            <button class="btn-delete" (click)="confirmDelete()">Delete</button>
        </div>

    </div>
</div>
