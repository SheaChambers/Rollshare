<div class="tech-card">
    
    <img class="thumb" [src]="technique.thumbnail_blob_url || 'assets/images/video-placeholder.jpg' " 
        alt="{{ technique.name }}">
    
    <h4 class="name">{{ technique.name }}</h4>
    
    <p class="description">{{ technique.description }}</p>
    
    <button class="btn-view" (click)="viewTechnique()">
        {{ buttonText }}
    </button>

    <div class="card-actions">

        <button class="action-btn" (click)="toggleLike($event)">
            {{ technique.likes?.legnth || 0 }} Likes
        </button>

        <button class="action-btn" (click)="viewTechnique()">
            {{ technique.reviews?.length || 0 }} Comments
        </button>

        <button class="action-btn" (click)="toggleSave($event)">
            {{ technique.isSaved ? 'Saved' : 'Save'}}
        </button>

    </div>
</div>
