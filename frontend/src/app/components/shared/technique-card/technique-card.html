<div class="tech-card">
    
    <img class="thumb" [src]="technique.thumbnail_blob_url || 'assets/images/video-placeholder.jpg' " 
        alt="{{ technique.name }}">
    
    <h4 class="name">{{ technique.name }}</h4>
    
    <p class="description">{{ technique.description }}</p>
    
    <button class="btn-view" (click)="viewTechnique()">
        {{ buttonText }}
    </button>
</div>
