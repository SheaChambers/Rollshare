<div class="gyms-container">

  <div class="gym-card" *ngIf="gym">

    <!-- IMAGE THUMBNAIL -->
    <div class="thumb-wrapper" (click)="viewGym()">
      <img class="gym-thumbnail"
            [src]="getGymThumbnail()"
            alt="Gym Photo">
    </div>

    <!-- TITLE + LOCATION -->
    <div class="gym-header">
      <h3>{{ gym.name }}</h3>
      <p class="gym-location" *ngIf="gym.city">
          {{ gym.city }}
      </p>
    </div>

    <!-- RATING -->
    <div class="rating-row" *ngIf="gym.reviews?.length">
      <img src="assets/images/star.png" class="star-icon" *ngFor="let s of getStars()">
      <span class="rating-count">({{ gym.reviews.length }})</span>
    </div>

    <!-- CONTACT -->
    <div class="gym-info">
      <div class="info-row" *ngIf="gym.contact.phone">
        <strong>Phone:</strong> {{ gym.contact.phone }}
      </div>
      <div class="info-row" *ngIf="gym.contact.email">
        <strong>Email:</strong> {{ gym.contact.email }}
      </div>
      <div class="info-row" *ngIf="gym.contact.website">
        <strong>Website: </strong>
        <a [href]="gym.contact.website" target="_blank">Visit</a>
      </div>
    </div>

    <button class="btn-view" (click)="viewGym()">View Gym</button>

  </div>

</div>
