name: RollShare CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # JOB 1: Backend Validation
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint backend
        working-directory: backend
        run: |
          pip install flake8
          # Check for critical syntax/logic errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Install AI dependencies
        run: |
          # If ai_service has its own requirements, install them here
          if [ -f ai_service/requirements.txt ]; then pip install -r ai_service/requirements.txt; fi
        
      - name: Debug and Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Current Directory: $(pwd)"
          echo "Workspace Root: ${{ github.workspace }}"
          echo "Listing Root Content:"
          ls -R ..
          pip install pytest
          pytest

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pytest
          if [ -d "tests" ]; then pytest; else echo "No tests found"; fi


  # JOB 2: Frontend Validation (Angular)
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration=production