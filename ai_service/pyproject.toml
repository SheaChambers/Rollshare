[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_service"
version = "0.1.0"

[tool.setuptools]
packages = ["ai_service"]

[tool.setuptools.package-dir]
ai_service = "ai_service"

[tool.setuptools.package-data]
ai_service = [
    "models/*.pkl",
    "features/*.npz"
]